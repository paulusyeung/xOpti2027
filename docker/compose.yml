services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${XOPTI_PG_PASSWORD:-xopti}
      POSTGRES_DB: xopti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xopti"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      ConnectionStrings__XOptiDatabase: Host=postgres;Database=xopti;Username=postgres;Password=${XOPTI_PG_PASSWORD:-xopti}
      XOPTI_DATA_PROTECTION_KEYS: /var/lib/xopti/dpkeys
    volumes:
      - filevolume:/var/lib/xopti/files
      - dataprotection:/var/lib/xopti/dpkeys
    depends_on:
      postgres:
        condition: service_healthy
    # Schema changes are applied ONLY by one-shot jobs, never at startup:
    #   docker compose run --rm api --bootstrap   # fresh database: script + migrations + seed
    #   docker compose run --rm api --migrate     # apply app-owned migrations only
    command: []

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    environment:
      # Optional pivot analytics. Disabled unless enabled and a licence key is supplied.
      XOPTI_ANALYTICS_ENABLED: ${XOPTI_ANALYTICS_ENABLED:-false}
      XOPTI_WPT_LICENSE_KEY: ${XOPTI_WPT_LICENSE_KEY:-}
    ports:
      - "${XOPTI_HTTP_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
  filevolume:
  dataprotection:
